<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Propuesto 3 - Galería con zoom</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Galería de paisajes</h1>
  <main class="galeria">
    <figure class="foto" tabindex="0">
      <img src="imagenes/amanecer-montana.svg" alt="Amanecer en la montaña">
      <figcaption><strong>Amanecer en la montaña</strong><br>Primeros rayos sobre las cumbres.</figcaption>
    </figure>
    <figure class="foto" tabindex="0">
      <img src="imagenes/atardecer.svg" alt="Atardecer violeta">
      <figcaption><strong>Atardecer violeta</strong><br>El cielo cambia de color al caer el sol.</figcaption>
    </figure>
    <figure class="foto" tabindex="0">
      <img src="imagenes/valle-nocturno.svg" alt="Valle nocturno">
      <figcaption><strong>Valle nocturno</strong><br>Una noche tranquila entre colinas.</figcaption>
    </figure>
    <figure class="foto" tabindex="0">
      <img src="imagenes/bosque.svg" alt="Bosque en calma">
      <figcaption><strong>Bosque en calma</strong><br>Verdes profundos bajo un cielo claro.</figcaption>
    </figure>
    <figure class="foto" tabindex="0">
      <img src="imagenes/desierto.svg" alt="Dunas doradas">
      <figcaption><strong>Dunas doradas</strong><br>Calor y luz en el desierto.</figcaption>
    </figure>
    <figure class="foto" tabindex="0">
      <img src="imagenes/costa.svg" alt="Costa abierta">
      <figcaption><strong>Costa abierta</strong><br>Montañas que bajan hasta el mar.</figcaption>
    </figure>
  </main>
</body>
</html>
